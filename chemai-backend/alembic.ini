# Alembic 迁移配置文件
# ChemAI 后端数据库迁移工具

[alembic]
# 迁移脚本所在目录
script_location = alembic

# 迁移文件名模板：时间戳_版本号_描述
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s

# 时区（生成迁移文件的时间戳用）
timezone = Asia/Shanghai

# 数据库连接字符串（可被环境变量覆盖）
# 开发环境默认用 SQLite
sqlalchemy.url = sqlite:///./chemai.db

# 输出编码
output_encoding = utf-8

[post_write_hooks]
# 可选：迁移脚本生成后运行格式化工具（此处留空）

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
