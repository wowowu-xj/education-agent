<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>登录 · ChemAI 智辅化学</title>

  <!-- Fonts：Academic Catalyst 三段式字体 -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">

  <!-- Tailwind CSS（Play CDN，零构建）-->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            oxford: '#002147',
            'oxford-hover': '#001a38',
            teal: '#0d7377',
            'teal-hover': '#0a5c5f',
            paper: '#faf8f5',
            'bg-warm': '#f5f0e8',
            accent: '#d4a574',
            ink: '#1a1a2e',
            muted: '#6b7280',
            block: '#b43c28',
            'block-bg': '#fdecea',
          },
          fontFamily: {
            serif: ['Cormorant Garamond', 'Noto Serif SC', 'serif'],
            sans: ['IBM Plex Sans', 'Noto Sans SC', 'sans-serif'],
          },
          borderRadius: { DEFAULT: '8px' },
        },
      },
    };
  </script>

  <!-- Vue 3（全局构建 CDN）-->
  <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>

  <style>
    .labnote-grid {
      background-image:
        linear-gradient(rgba(0, 33, 71, 0.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0, 33, 71, 0.04) 1px, transparent 1px);
      background-size: 24px 24px;
    }
    .card-labnote { border-left: 2px solid #b43c28; }
    .btn-feedback { transition: transform 0.1s ease, box-shadow 0.1s ease, opacity 0.1s ease; }
    .btn-feedback:hover { box-shadow: 0 4px 12px -2px rgba(0, 33, 71, 0.25); }
    .btn-feedback:active { transform: scale(0.97); }
    .btn-feedback:disabled { opacity: 0.5; }
  </style>
</head>
<body class="bg-paper text-ink font-sans antialiased">
  <div id="app" class="min-h-screen labnote-grid flex items-center justify-center px-6 py-16">
    <div class="w-full max-w-md">
      <!-- 品牌 -->
      <div class="text-center mb-8">
        <h1 class="font-serif text-4xl font-bold text-oxford tracking-tight">ChemAI</h1>
        <p class="text-sm text-muted mt-1 tracking-widest uppercase">智辅化学 · 教师端</p>
      </div>

      <!-- 登录卡片 -->
      <div class="card-labnote bg-white border border-accent/40 rounded-lg p-8 shadow-sm">
        <h2 class="font-serif text-xl font-semibold text-oxford mb-6">登录</h2>

        <!-- 错误提示 -->
        <div v-if="error" class="mb-4 px-3 py-2.5 bg-block-bg border border-block/30 rounded text-sm text-block">
          {{ error }}
        </div>

        <form @submit.prevent="submit" class="space-y-4">
          <div>
            <label class="block text-xs font-semibold text-muted uppercase tracking-wider mb-2" for="username">用户名</label>
            <input
              id="username"
              v-model="username"
              type="text"
              autocomplete="username"
              placeholder="请输入用户名"
              class="w-full px-3 py-2.5 bg-white border border-accent/40 rounded-lg text-sm outline-none focus:border-oxford">
          </div>
          <div>
            <label class="block text-xs font-semibold text-muted uppercase tracking-wider mb-2" for="password">密码</label>
            <input
              id="password"
              v-model="password"
              type="password"
              autocomplete="current-password"
              placeholder="请输入密码"
              class="w-full px-3 py-2.5 bg-white border border-accent/40 rounded-lg text-sm outline-none focus:border-oxford">
          </div>
          <button
            type="submit"
            :disabled="submitting"
            class="btn-feedback w-full bg-oxford text-white px-4 py-2.5 rounded-lg text-sm font-semibold hover:bg-oxford-hover">
            {{ submitting ? '登录中…' : '登录' }}
          </button>
        </form>
      </div>

      <p class="text-center text-xs text-muted mt-6">ChemAI 智辅化学 · AI 驱动的化学教学辅助平台</p>
    </div>
  </div>

  <script>
    const TOKEN_KEY = 'chemai_access_token';
    const REFRESH_KEY = 'chemai_refresh_token';
    const ROLE_KEY = 'chemai_user_role';

    Vue.createApp({
      setup() {
        const username = Vue.ref('');
        const password = Vue.ref('');
        const submitting = Vue.ref(false);
        const error = Vue.ref('');

        // 按角色决定登录后的落地页：教师系 → 工作台；学生 → 学生端
        function landingPage(role) {
          return role === 'student' ? '/pages/student.html' : '/pages/question-workbench.html';
        }

        // 已登录：按角色直接跳转，避免重复登录
        if (localStorage.getItem(TOKEN_KEY)) {
          location.href = landingPage(localStorage.getItem(ROLE_KEY));
        }

        async function submit() {
          error.value = '';
          if (!username.value.trim() || !password.value) {
            error.value = '请输入用户名和密码';
            return;
          }

          submitting.value = true;
          try {
            const resp = await fetch('/api/auth/login', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ username: username.value.trim(), password: password.value }),
            });
            const data = await resp.json().catch(() => null);

            if (!resp.ok) {
              // 后端统一错误结构：{"detail":{"error","message"}}；兼容 {"message":...}
              error.value = (data && (data.detail && data.detail.message || data.message)) || '登录失败，请稍后重试';
              return;
            }

            localStorage.setItem(TOKEN_KEY, data.access_token);
            localStorage.setItem(REFRESH_KEY, data.refresh_token);
            localStorage.setItem(ROLE_KEY, (data.user && data.user.role) || '');
            location.href = landingPage(data.user && data.user.role);
          } catch (e) {
            error.value = '网络错误，请稍后重试';
          } finally {
            submitting.value = false;
          }
        }

        return { username, password, submitting, error, submit };
      },
    }).mount('#app');
  </script>
</body>
</html>
